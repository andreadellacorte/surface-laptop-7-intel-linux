# Surface Laptop for Business 7th Edition (Intel): front camera OV02C10 is clocked at a fixed
# 12 MHz; stock driver refuses anything but 19.2 MHz. Patched to warn and continue (~18.8 fps).
# Based on LKML patch "media: i2c: ov02c10: tolerate a sensor clock other than 19.2 MHz"
# (Jul 2026), on Linux 7.2.15 ov02c10.c. Remove once upstream accepts non-19.2 MHz clocks.
PACKAGE_NAME="sl7-camera"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="ov02c10"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
