# Surface Laptop for Business 7th Edition (Intel): IR camera (ST VD55G0, ACPI SMO55F0) + IR flood emitter.
# vd55g0: linux-surface kernel PR #164 driver, fixed for mainline int3472 (dovdd), reset gpio on
# ACPI, poll error bug, Windows strobe timing (0x0470-0x0479), all GPIOs strobe, manual exposure
# clamped to 644 lines (emitter eye-safety). ipu-bridge: 7.2.15 + SMO55F0 entry (1 lane, 402 MHz).
PACKAGE_NAME="sl7-ir"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="vd55g0"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="ipu-bridge"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
