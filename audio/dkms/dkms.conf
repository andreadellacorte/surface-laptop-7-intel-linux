# Surface Laptop for Business 7th Edition (Intel): skip the ACPI-declared RT1320 amp that never
# attaches (otherwise sof_sdw fails with a duplicate SDW0-Capture-SmartMic link and there is no
# sound card). Patch from github.com/floopflop/SL_Intel_Linux, on Linux 7.2.15 sdw_utils.
PACKAGE_NAME="sl7-audio"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="snd-soc-sdw-utils"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
